org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# No org.gradle.java.home here on purpose.
#
# It used to pin Gradle to Android Studio's bundled runtime. That runtime is
# now JBR 25, whose class files Gradle 8.9 cannot read ("Unsupported class file
# major version 69"), so every Android build failed. It was also an absolute
# macOS path in a tracked file, so it was wrong for anyone who installed
# Android Studio elsewhere.
#
# Without it, Gradle runs on the JVM Flutter launches it with, which each
# developer sets for themselves:
#
#   flutter config --jdk-dir <path-to-jdk-17>
#
# Gradle 8.9 and AGP 8.7.2 want Java 17 or 21.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
