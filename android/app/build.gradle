plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file("key.properties")
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}
def releaseValue = { name, envName ->
    System.getenv(envName) ?: uploadProperties.getProperty(name)
}
def registeredAppId = releaseValue("applicationId", "APSARA_ANDROID_APP_ID")
def uploadStore = releaseValue("storeFile", "APSARA_UPLOAD_STORE_FILE")
def uploadStorePassword = releaseValue("storePassword", "APSARA_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = releaseValue("keyAlias", "APSARA_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = releaseValue("keyPassword", "APSARA_UPLOAD_KEY_PASSWORD")

// Local tests can run without Firebase. Production builds require its real config.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace = "com.example.apsaratalent_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = registeredAppId ?: "com.example.apsaratalent_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (uploadStore) storeFile = rootProject.file(uploadStore)
            storePassword = uploadStorePassword
            keyAlias = uploadKeyAlias
            keyPassword = uploadKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

tasks.register("validateProductionConfiguration") {
    doLast {
        if (!registeredAppId || registeredAppId.startsWith("com.example.")) {
            throw new GradleException("Set the registered applicationId in android/key.properties or APSARA_ANDROID_APP_ID before building a release.")
        }
        if (!uploadStore || !rootProject.file(uploadStore).exists() || !uploadStorePassword || !uploadKeyAlias || !uploadKeyPassword) {
            throw new GradleException("Configure the existing upload keystore, alias and passwords in android/key.properties or APSARA_UPLOAD_* environment variables.")
        }
        if (!file("google-services.json").exists()) {
            throw new GradleException("Install android/app/google-services.json for the registered production app.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") task.dependsOn("validateProductionConfiguration")
}

flutter {
    source = "../.."
}
